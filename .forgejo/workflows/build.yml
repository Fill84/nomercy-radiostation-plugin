name: build

# Builds the NoMercy Internet Radio plugin against the upstream
# NoMercy.Plugins.Abstractions source (cloned at run-time, because the
# abstractions package is not published to nuget.org yet).
#
# On a `v*` tag push, a Forgejo release is created and the packaged plugin
# zip is attached as an asset.

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_DIR: NoMercy.Plugin.InternetRadio
  SERVER_REPO: https://github.com/NoMercy-Entertainment/nomercy-media-server.git
  SERVER_BRANCH: dev
  DOTNET_CHANNEL: "10.0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install base tooling
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y --no-install-recommends git curl ca-certificates zip unzip jq libicu-dev
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Install .NET SDK ${{ env.DOTNET_CHANNEL }}
        run: |
          set -eux
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --info

      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Clone NoMercy MediaServer (for Plugins.Abstractions source)
        run: |
          set -eux
          git clone --depth=1 --branch="$SERVER_BRANCH" "$SERVER_REPO" _server

      - name: Pack abstractions to local NuGet feed
        run: |
          set -eux
          mkdir -p "$PWD/_nupkgs"
          # NoMercy.Plugins.Abstractions depends on NoMercy.Events.
          # Pack both into a local file feed so the plugin's PackageReference
          # (Version="*") can resolve them without a private NuGet server.
          dotnet pack _server/src/NoMercy.Events/NoMercy.Events.csproj \
            -c Release -o "$PWD/_nupkgs"
          dotnet pack _server/src/NoMercy.Plugins.Abstractions/NoMercy.Plugins.Abstractions.csproj \
            -c Release -o "$PWD/_nupkgs"
          ls -la "$PWD/_nupkgs"

      - name: Write plugin nuget.config (local feed + nuget.org)
        run: |
          set -eux
          cat > "$PLUGIN_DIR/nuget.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="local"     value="../_nupkgs" />
            </packageSources>
          </configuration>
          EOF
          cat "$PLUGIN_DIR/nuget.config"

      - name: Restore + build plugin (Release)
        run: |
          set -eux
          dotnet restore "$PLUGIN_DIR/$PLUGIN_DIR.csproj"
          dotnet build   "$PLUGIN_DIR/$PLUGIN_DIR.csproj" -c Release --no-restore

      - name: Stage release artifact
        id: stage
        run: |
          set -eux
          BIN="$PLUGIN_DIR/bin/Release/net10.0"
          STAGING="$PWD/_stage/$PLUGIN_DIR"
          mkdir -p "$STAGING"
          cp "$BIN/$PLUGIN_DIR.dll" "$STAGING/"
          cp "$PLUGIN_DIR/plugin.json" "$STAGING/"
          cp "$PLUGIN_DIR/README.md"   "$STAGING/"

          # Derive a version: vX.Y.Z tag → X.Y.Z, otherwise dev-<short-sha>.
          REF="${GITHUB_REF_NAME:-}"
          case "$REF" in
            v*) VERSION="${REF#v}" ;;
            *)  VERSION="dev-${GITHUB_SHA:0:8}" ;;
          esac

          ZIP="$PLUGIN_DIR-$VERSION.zip"
          (cd "$PWD/_stage" && zip -r "../$ZIP" "$PLUGIN_DIR")
          ls -la "$ZIP"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP"         >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: plugin
          path: ${{ steps.stage.outputs.zip }}
          if-no-files-found: error

    outputs:
      version: ${{ steps.stage.outputs.version }}
      zip:     ${{ steps.stage.outputs.zip }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Install tooling
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y --no-install-recommends curl ca-certificates jq
          fi

      - name: Download plugin artifact
        uses: actions/download-artifact@v3
        with:
          name: plugin

      - name: Create Forgejo release & attach asset
        env:
          # GITHUB_TOKEN here is the auto-generated Forgejo Actions token.
          # No extra secret setup needed for the same-repo release.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="${{ needs.build.outputs.zip }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          API="${GITHUB_API_URL%/}"

          BODY=$(cat <<EOF
          ## NoMercy Internet Radio Provider — ${TAG}

          Drop-in plugin for [NoMercy MediaServer](https://github.com/NoMercy-Entertainment/nomercy-media-server).

          ### Install
          1. Extract \`${ZIP}\` into \`<server>/plugins/\`.
          2. Restart the server.

          Built automatically by Forgejo Actions against
          \`NoMercy-Entertainment/nomercy-media-server@${SERVER_BRANCH:-dev}\`.
          EOF
          )

          echo "Creating release $TAG in $REPO"
          REL_JSON=$(curl -fsSL -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" \
                  '{tag_name:$tag, name:$tag, body:$body, draft:false, prerelease:false}')")

          REL_ID=$(echo "$REL_JSON" | jq -r '.id')
          echo "release id = $REL_ID"

          echo "Uploading asset $ZIP"
          curl -fsSL -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ZIP" \
            "$API/repos/$REPO/releases/$REL_ID/assets?name=$(basename "$ZIP")"

          echo "✓ Release published: $TAG"
